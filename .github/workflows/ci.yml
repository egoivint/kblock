name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python syntax
        run: python3 -m py_compile kblock kblock-gui
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh build-release.sh setup-input-access.sh remove-input-access.sh
      - name: Desktop entry
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate kblock.desktop
