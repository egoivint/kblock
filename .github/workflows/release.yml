name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build packages
        run: ./build-release.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: kblock ${{ github.ref_name }}
          body: |
            Keyboard lock for cleaning the keyboard (X11 and Wayland).

            Installation, Wayland setup and usage: https://github.com/egoivint/kblock#readme
          overwrite_files: true
